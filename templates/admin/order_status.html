{% extends 'base.html' %}
{% block title %}Update Order Status - Admin{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1>Update Order #{{ order.id }}</h1>
          <form method="post">
            {{ form.hidden_tag() }}
            <div class="mb-3">{{ form.status.label(class_='form-label') }}{{ form.status(class_='form-select') }}</div>
            <button class="btn btn-primary" type="submit">Save Status</button>
            <a class="btn btn-secondary" href="{{ url_for('admin.orders_admin') }}">Back</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Manage Categories - Admin{% endblock %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Categories</h1>
    <div>
      <a href="{{ url_for('admin.add_category') }}" class="btn btn-primary">Add Category</a>
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Dashboard</a>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="table-light"><tr><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
      <tbody>
        {% for category in categories %}
          <tr>
            <td>{{ category.name }}</td>
            <td>{{ category.description }}</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="{{ url_for('admin.edit_category', category_id=category.id) }}">Edit</a>
              <form class="d-inline" method="post" action="{{ url_for('admin.delete_category', category_id=category.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="btn btn-sm btn-danger">Delete</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
